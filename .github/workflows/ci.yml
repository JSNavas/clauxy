name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python3 tests/run.py
      - name: Panel refresh behavior
        run: |
          python3 -c 'import sys; sys.path.insert(0, "tests"); from helpers import account, pool, load; print(load().render_panel(pool(account("demo")).snapshot()))' > "$RUNNER_TEMP/clauxy-panel.html"
          node tests/test_panel_refresh.js < "$RUNNER_TEMP/clauxy-panel.html"
      - name: Both entry points parse
        run: |
          python3 -m py_compile clauxy clauxy_proxy.py clauxy_vpn.py clauxy_accounts.py clauxy_network.py
          python3 clauxy --help > /dev/null
